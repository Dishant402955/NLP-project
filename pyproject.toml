[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2bash"
version = "0.1.0"
description = "A hybrid NLP system for translating natural-language requests into Bash commands."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.7,<1.8",
    "numpy>=1.24",
    "joblib>=1.2",
    "bashlex>=0.18,<0.19",
]

[project.scripts]
nl2bash-prepare-dataset = "nl2bash.dataset_cli:main"
nl2bash-annotations = "nl2bash.annotation_cli:main"
nl2bash-classifier = "nl2bash.classifier_cli:main"
nl2bash = "nl2bash.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["nl2bash*"]
