name: Python package and entity benchmark smoke checks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-smoke.yml"
      - "pyproject.toml"
      - "notebooks/**"
      - "uv.lock"
      - "src/nl2bash/**"
      - "data/annotations/entity_test_ai_suggestions.jsonl"
      - "data/annotations/entity_test_human_review.csv"
      - "data/annotations/entity_test_review_manifest.json"
      - "artifacts/evaluation/entity_test_report.json"
      - "artifacts/evaluation/entity_test_evaluation.lock"
      - "artifacts/evaluation/generation_dev_v7_report.json"
      - "data/annotations/generation_dev_v7_semantic_review.csv"
      - "data/annotations/generation_dev_v7_human_review_attestation.json"
      - "data/annotations/generation_dev_v7_assistant_semantic_review.csv"
      - "data/annotations/test_review.csv"
      - "data/processed/nl2bash/test.jsonl"
      - "data/processed/nl2bash/manifest.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install locked project dependencies
        run: uv sync --locked

      - name: Verify installed command entry points
        run: |
          uv run nl2bash --help >/dev/null
          uv run nl2bash generate --help >/dev/null
          uv run nl2bash validate --help >/dev/null
          uv run nl2bash-prepare-dataset --help >/dev/null
          uv run nl2bash-annotations --help >/dev/null
          uv run nl2bash-classifier --help >/dev/null
          uv run python -m nl2bash.entity_benchmark_cli --help >/dev/null
          python -m compileall -q src/nl2bash
          echo "All declared package entry points and the entity evaluator module CLI expose help successfully."

      - name: Verify parse-only Bash validation and safety findings
        run: |
          set +e
          uv run nl2bash validate --command "find . -type f -name '*.py'" --json > "$RUNNER_TEMP/safe-command.json"
          safe_status=$?
          uv run nl2bash validate --command "sudo rm -rf /" --json > "$RUNNER_TEMP/risky-command.json"
          risky_status=$?
          uv run nl2bash validate --command "if then" --json > "$RUNNER_TEMP/invalid-command.json"
          invalid_status=$?
          set -e
          export SAFE_STATUS="$safe_status" RISKY_STATUS="$risky_status" INVALID_STATUS="$invalid_status"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          safe = json.loads((root / "safe-command.json").read_text())
          risky = json.loads((root / "risky-command.json").read_text())
          invalid = json.loads((root / "invalid-command.json").read_text())

          assert os.environ["SAFE_STATUS"] == "0"
          assert safe["syntax_valid"] is True and safe["review_required"] is False
          assert safe["risk_level"] == "none" and safe["executed"] is False

          assert os.environ["RISKY_STATUS"] == "3"
          assert risky["syntax_valid"] is True and risky["review_required"] is True
          assert risky["risk_level"] == "high" and risky["executed"] is False
          assert any(item["code"] == "broad_delete_target" for item in risky["findings"])

          assert os.environ["INVALID_STATUS"] == "3"
          assert invalid["syntax_valid"] is False and invalid["executed"] is False
          print("Safe Bash, high-risk destructive Bash, and invalid Bash syntax were classified correctly; none was executed.")
          PY

      - name: Verify entity sample provenance and exact candidate spans
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          root = Path(".")
          read_json = lambda path: json.loads((root / path).read_text(encoding="utf-8"))
          sha256 = lambda path: hashlib.sha256((root / path).read_bytes()).hexdigest()

          manifest = read_json("data/annotations/entity_test_review_manifest.json")
          dataset_manifest = read_json("data/processed/nl2bash/manifest.json")
          suggestion_path = root / "data/annotations/entity_test_ai_suggestions.jsonl"
          suggestions = [
              json.loads(line)
              for line in suggestion_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          partition_path = "data/processed/nl2bash/test.jsonl"
          partition = [
              json.loads(line)
              for line in (root / partition_path).read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          review_path = root / "data/annotations/entity_test_human_review.csv"
          report_path = root / "artifacts/evaluation/entity_test_report.json"
          guard_path = root / "artifacts/evaluation/entity_test_evaluation.lock"

          assert manifest["sample_size"] == 66
          assert len(suggestions) == 66
          assert len(manifest["sample_example_ids"]) == 66
          assert len(manifest["sample_group_ids"]) == 66
          assert manifest["source_worklist"] == "data/annotations/test_review.csv"
          assert sha256("data/annotations/test_review.csv") == manifest["source_worklist_sha256"]
          assert sha256(partition_path) == manifest["source_partition_sha256"]
          provenance = manifest.get("annotation_provenance")
          assert isinstance(provenance, dict)
          assert provenance.get("method") == "request-only AI-assisted entity candidates reviewed and approved by project owner"
          assert provenance.get("owner_approved_rows") == 66
          assert provenance.get("independent_annotation_claimed") is False

          source_by_id = {row["example_id"]: row for row in partition}
          counts = Counter()
          entity_types = set(manifest["entity_types"])
          for index, row in enumerate(suggestions):
              assert row["example_id"] == manifest["sample_example_ids"][index]
              assert row["group_id"] == manifest["sample_group_ids"][index]
              source = source_by_id[row["example_id"]]
              assert row["group_id"] == source["group_id"]
              assert row["request"] == source["request"]
              assert row["annotation_method"].startswith("AI-assisted request-only")
              assert row["needs_review"] is True
              for entity in row["suggested_entities"]:
                  assert entity["entity_type"] in entity_types
                  start, end = entity["start"], entity["end"]
                  assert isinstance(start, int) and isinstance(end, int) and 0 <= start < end <= len(row["request"])
                  assert row["request"][start:end] == entity["value"]
                  counts[entity["entity_type"]] += 1

          assert len({row["example_id"] for row in suggestions}) == 66
          assert len({row["group_id"] for row in suggestions}) == 66
          assert dict(counts) == manifest["candidate_entity_counts"]

          with review_path.open(encoding="utf-8-sig", newline="") as stream:
              review_rows = list(csv.DictReader(stream))
          assert len(review_rows) == 66
          assert [row["example_id"] for row in review_rows] == manifest["sample_example_ids"]
          confirmed_count = 0
          for review_row in review_rows:
              assert review_row["review_status"] == "confirmed"
              assert review_row["reviewer_note"].strip()
              source = source_by_id[review_row["example_id"]]
              assert review_row["group_id"] == source["group_id"]
              assert review_row["request"] == source["request"]
              entities = json.loads(review_row["confirmed_entities_json"])
              assert isinstance(entities, list)
              seen = set()
              for entity in entities:
                  assert entity["entity_type"] in entity_types
                  start, end = entity["start"], entity["end"]
                  assert isinstance(start, int) and isinstance(end, int) and 0 <= start < end <= len(source["request"])
                  assert source["request"][start:end] == entity["value"]
                  key = (entity["entity_type"], entity["value"], start, end)
                  assert key not in seen
                  seen.add(key)
                  confirmed_count += 1
          assert confirmed_count == 113

          report = read_json("artifacts/evaluation/entity_test_report.json")
          guard = read_json("artifacts/evaluation/entity_test_evaluation.lock")
          report_bytes = (json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2) + "\n").encode("utf-8")
          assert report["artifact_type"] == "entity_extraction_test_evaluation"
          assert report["evaluated_once"] is True
          assert report["sample_size"] == 66
          assert report["metrics"]["total_gold"] == 113
          assert report["metrics"]["total_correct"] == 73
          assert guard["status"] == "completed" and guard["sample_size"] == 66
          assert guard["review_csv_sha256"] == sha256(review_path)
          assert guard["report_sha256"] == hashlib.sha256(report_bytes).hexdigest()

          print("Entity sample provenance, owner-confirmed spans, one-time report, and guard integrity verified.")
          print(f"Rows: {len(suggestions)}; original candidate spans: {sum(counts.values())}; confirmed spans: {confirmed_count}; entity types proposed: {len(counts)}")
          PY

      - name: Verify Google Colab notebook structure and Python code cells
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          path = Path("notebooks/NL2Bash_Colab.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))
          assert notebook["nbformat"] == 4
          assert notebook["metadata"]["kernelspec"]["name"] == "python3"
          cells = notebook["cells"]
          assert len(cells) >= 10
          ids = [cell.get("id") for cell in cells]
          assert all(isinstance(cell_id, str) and cell_id for cell_id in ids)
          assert len(set(ids)) == len(ids)

          code_count = 0
          for index, cell in enumerate(cells):
              assert cell["cell_type"] in {"markdown", "code"}
              source = cell["source"]
              source_text = "".join(source) if isinstance(source, list) else source
              if cell["cell_type"] == "code":
                  ast.parse(source_text, filename=f"{path}:cell-{index}")
                  code_count += 1

          all_text = "\\n".join(
              "".join(cell["source"]) if isinstance(cell["source"], list) else cell["source"]
              for cell in cells
          )
          for required in ("ENABLE_LOCAL_LLM", "load_intent_classifier", "extract_entities",
                           "validate_bash_command", "generation_dev_v7_report.json"):
              assert required in all_text, f"missing notebook section: {required}"

          print(f"Colab notebook verified: {len(cells)} cells, {code_count} syntactically valid Python cells.")
          PY

      - name: Verify v7 development report and blinded semantic review artifacts
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          def read_rows(path):
              with Path(path).open(encoding="utf-8-sig", newline="") as stream:
                  return list(csv.DictReader(stream))

          report = json.loads(Path("artifacts/evaluation/generation_dev_v7_report.json").read_text(encoding="utf-8"))
          official = read_rows("data/annotations/generation_dev_v7_semantic_review.csv")
          assistant = read_rows("data/annotations/generation_dev_v7_assistant_semantic_review.csv")
          attestation = json.loads(Path("data/annotations/generation_dev_v7_human_review_attestation.json").read_text(encoding="utf-8"))

          assert report["evaluation_type"] == "development_generation_comparison"
          assert report["sample_size"] == 40
          assert report["test_data_used"] is False
          assert report["reference_commands_in_generation_prompts"] is False
          assert set(report["metrics"]) == {"request_only", "nlp_context"}

          assert len(official) == 80
          official_by_id = {row["review_item_id"]: row for row in official}
          assert len(official_by_id) == 80
          assert all(not row["semantic_rating"] and not row["reviewer_note"] for row in official)
          assert all(row["review_item_id"].endswith(("-A", "-B")) for row in official)

          assert attestation["artifact_type"] == "generation_v7_human_semantic_review_attestation"
          assert attestation["status"] == "completed"
          assert attestation["reviewed_request_count"] == 40
          assert attestation["reviewed_candidate_count"] == 80
          assert attestation["reviewed_item_ids"] == [row["review_item_id"] for row in official]
          assert attestation["structured_ratings_recorded"] is False

          assert len(assistant) == 80
          assistant_by_id = {row["review_item_id"]: row for row in assistant}
          assert set(assistant_by_id) == set(official_by_id)
          allowed = {"correct_as_written", "partially_correct_needs_edits", "incorrect_or_unsafe"}
          for review_id, row in assistant_by_id.items():
              source = official_by_id[review_id]
              assert row["reviewer_type"] == "assistant_preliminary_not_human_gold"
              assert row["reviewer_id"].strip()
              assert row["semantic_rating"] in allowed
              assert row["reviewer_note"].strip()
              for field in ("example_id", "request", "candidate_command", "generation_succeeded"):
                  assert row[field] == source[field]
              assert "condition" not in row and "variant" not in row

          print("v7 report is development-only; all 80 candidates have an owner-completion attestation; unprovided human ratings remain unreported; assistant assessments remain separate.")
          PY
