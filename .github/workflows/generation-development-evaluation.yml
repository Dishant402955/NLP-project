name: Hybrid command-generation development evaluation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generation-development-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nl2bash-generation-hybrid
  cancel-in-progress: false

jobs:
  evaluate-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install locked base dependencies
        run: uv sync --locked

      - name: Build and install the pinned CPU inference runtime
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_OPENMP=ON"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          FORCE_CMAKE: "1"
        run: uv pip install --python .venv/bin/python llama-cpp-python==0.3.37

      - name: Download and verify the local Qwen GGUF model
        run: |
          mkdir -p "$RUNNER_TEMP/nl2bash-model"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/91cad51170dc346986eccefdc2dd33a9da36ead9/qwen2.5-1.5b-instruct-q4_k_m.gguf" \
            --output "$RUNNER_TEMP/nl2bash-model/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          echo "6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e  $RUNNER_TEMP/nl2bash-model/qwen2.5-1.5b-instruct-q4_k_m.gguf" | sha256sum --check

      - name: Verify the frozen hybrid configuration
        env:
          NL2BASH_MODEL: ${{ runner.temp }}/nl2bash-model/qwen2.5-1.5b-instruct-q4_k_m.gguf
        run: |
          uv run python - <<'PY'
          import os
          from nl2bash.generation_configuration import verify_frozen_generation_configuration

          digest = verify_frozen_generation_configuration(
              "artifacts/evaluation/frozen_generation_config.json",
              model_path=os.environ["NL2BASH_MODEL"],
              classifier_model_path="models/intent_classifier.joblib",
              classifier_manifest_path="models/intent_classifier_manifest.json",
              frozen_threshold_path="artifacts/evaluation/frozen_dev_threshold.json",
              context_size=1024,
              threads=2,
              batch_size=128,
              gpu_layers=0,
              max_tokens=48,
          )
          print(f"Frozen hybrid configuration verified: {digest}")
          PY

      - name: Run a separate 20-request development-only comparison
        env:
          NL2BASH_MODEL: ${{ runner.temp }}/nl2bash-model/qwen2.5-1.5b-instruct-q4_k_m.gguf
        run: |
          uv run nl2bash evaluate-generation-dev \
            --llm-model "$NL2BASH_MODEL" \
            --sample-size 20 \
            --seed 20261127 \
            --threads 2 \
            --context-size 1024 \
            --batch-size 128 \
            --gpu-layers 0 \
            --max-tokens 48 \
            --output "$RUNNER_TEMP/nl2bash-generation-hybrid-ci.json"

      - name: Verify evaluation isolation and retain report
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "nl2bash-generation-hybrid-ci.json"
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["evaluation_type"] == "development_generation_comparison"
          assert report["sample_size"] == 20
          assert report["test_data_used"] is False
          assert report["reference_commands_in_generation_prompts"] is False
          assert len(report["examples"]) == 20
          print(json.dumps(report["metrics"], indent=2))
          print("Development-only hybrid evaluation verified; historical v7 reports and review worksheets were not modified.")
          PY

      - name: Upload hybrid development report
        uses: actions/upload-artifact@v4
        with:
          name: nl2bash-generation-hybrid-development
          path: ${{ runner.temp }}/nl2bash-generation-hybrid-ci.json
          if-no-files-found: error
          retention-days: 30
