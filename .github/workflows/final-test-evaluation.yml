name: Historical one-time classifier report integrity

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-test-evaluation.yml"
      - "artifacts/evaluation/test_report.json"
      - "artifacts/evaluation/test_evaluation.lock"
      - "data/annotations/test_review_manifest.json"
      - "uv.lock"
      - "src/nl2bash/annotation_validation.py"

permissions:
  contents: read

jobs:
  verify-record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the preserved project record
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install exact locked dependencies
        run: uv sync --locked

      - name: Validate confirmed test annotations
        run: uv run nl2bash-annotations validate --partition test

      - name: Verify one-time report provenance, score omission, and guard integrity
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          report_path = Path("artifacts/evaluation/test_report.json")
          guard_path = Path("artifacts/evaluation/test_evaluation.lock")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          guard = json.loads(guard_path.read_text(encoding="utf-8"))

          assert report["evaluated_once"] is True
          assert report["test_source"]["partition_name"] == "test"
          assert report["test_source"]["confirmed_annotations_sha256"]
          provenance = report["annotation_provenance"]
          assert provenance["owner_approved_rows"] == 375
          assert provenance["owner_corrections"] == 0
          assert provenance["independent_annotation_claimed"] is False
          assert "metrics" not in report
          assert report["metrics_publication"]["status"] == "omitted"
          assert guard["status"] == "completed"
          assert guard["report_sha256"] == hashlib.sha256(report_path.read_bytes()).hexdigest()

          print("The one-time classifier evaluation record, owner-review provenance, suppressed component scores, and report checksum are intact.")
          PY
